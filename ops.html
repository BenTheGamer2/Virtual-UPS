<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vUPS | Site Maintenance</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        .status-icon {
            font-size: 50px;
            color: #ff4444;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        p {
            font-size: 1.1rem;
            color: #b0b0b0;
            max-width: 500px;
            line-height: 1.6;
        }
        .bot-notice {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #666;
            border-top: 1px solid #333;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-icon">🔴</div>
        <h1>Site Maintenance</h1>
        <p>The vUPS website is currently undergoing scheduled updates. We expect to be back online in 1–2 hours. Thanks for your patience!</p>
        
        <div class="bot-notice">
            This is an automated announcement from the vUPS bot.
        </div>
    </div>
</body>
</html>
