<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual UPS Airlines — Operations</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#0e0b09;--surface:#161109;--card:#1c1510;
            --border:#2e1f12;--border2:#3d2b1a;
            --gold:#c8920a;--gold-lt:#e8a800;--gold-dim:#7a5500;
            --text:#d4c4a8;--text-dim:#7a6a52;--text-mute:#4a3a28;
            --green:#2d9e5f;--green-lt:#35c270;
            --red:#c0392b;--red-lt:#e74c3c;
            --blue:#2471a3;--blue-lt:#3498db;
        }
        body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;line-height:1.5;overflow-x:hidden}
        
        /* HEADER & LAYOUT */
        header{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.5rem;gap:1.5rem;position:sticky;top:0;z-index:200}
        .logo-mark{width:28px;height:28px;background:var(--gold);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.62rem;color:#1a0e06}
        .logo-name{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
        .logo-name span{color:var(--gold)}
        
        main{padding:1.25rem;max-width:1600px;margin:0 auto}
        .sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;padding-bottom:.65rem;border-bottom:1px solid var(--border)}
        .sec-title{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text)}

        /* MAP STYLING */
        #leaflet-map { height: 520px; width: 100%; background: #0a0805; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 1.5rem; z-index: 10; }
        .leaflet-container { background: #0a0805 !important; }
        
        /* TABLE STYLING */
        .card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:1rem}
        table{width:100%;border-collapse:collapse;font-size:.8rem}
        th{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);text-align:left;padding:.5rem .75rem;border-bottom:1px solid var(--border)}
        td{padding:.75rem;border-bottom:1px solid rgba(46,31,18,.6);font-family:monospace;font-size:.75rem}
        .b-gold{background:rgba(200,146,10,.12);color:var(--gold-lt);border:1px solid rgba(200,146,10,.3);padding:2px 6px;border-radius:2px}
        
        /* PROGRESS BAR */
        .flight-prog-bar{height:3px;background:rgba(0,0,0,.5);border-radius:2px;overflow:hidden;width:80px}
        .flight-prog-fill{height:100%;background:var(--gold);transition:width 1s linear}
    </style>
</head>
<body>

<header>
    <div class="logo-mark">UPS</div>
    <div class="logo-name">VIRTUAL <span>UPS</span> AIRLINES</div>
</header>

<main>
    <div class="sec-header">
        <div class="sec-title">LIVE <span>FLIGHT MAP</span></div>
        <div id="connection-status" style="font-size:0.7rem; color:var(--text-dim); font-family:monospace;">POLLING: ACTIVE</div>
    </div>

    <div id="leaflet-map"></div>

    <div class="sec-header">
        <div class="sec-title">ACTIVE <span>FLEET OPERATIONS</span></div>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>CALLSIGN</th>
                    <th>AIRCRAFT</th>
                    <th>PILOT</th>
                    <th>ALTITUDE</th>
                    <th>GS</th>
                    <th>PROGRESS</th>
                </tr>
            </thead>
            <tbody id="active-flights-table-body">
                <tr><td colspan="6" style="text-align:center; padding:2rem; color:var(--text-mute);">INITIALIZING TRACKER FEED...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script>
    // --- CONFIGURATION ---
    const SUPABASE_URL = "https://mpmvfqkmvvbnsqvtvlnu.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wbXZmcWttdnZibnNxdnR2bG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NDcwODgsImV4cCI6MjA4ODEyMzA4OH0.EUvbjOOgFcbvIJmod580C9tRH883vvBmUSZbKkSFgs0"; // <--- Add your key here
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- MAP SETUP ---
    const map = L.map('leaflet-map').setView([38.17, -85.73], 3); // Center on North America
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; CartoDB'
    }).addTo(map);

    let markers = {};

    // --- DATA POLLING ---
    async function fetchLiveFlights() {
        try {
            const { data, error } = await _supabase
                .from('state')
                .select('value')
                .eq('id', 1)
                .single();

            if (error) throw error;

            const flights = data.value.liveFlights || [];
            updateUI(flights);
            
        } catch (err) {
            console.error("Fetch Error:", err.message);
            document.getElementById('connection-status').innerText = "POLLING: ERROR";
        }
    }

    function updateUI(flights) {
        const tableBody = document.getElementById('active-flights-table-body');
        
        // 1. Clear dead markers (if a flight stops tracking)
        const currentCallsigns = flights.map(f => f.callsign);
        Object.keys(markers).forEach(callsign => {
            if (!currentCallsigns.includes(callsign)) {
                map.removeLayer(markers[callsign]);
                delete markers[callsign];
            }
        });

        if (flights.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:2rem; color:var(--text-mute);">NO ACTIVE FLIGHTS</td></tr>';
            return;
        }

        let tableHtml = "";

        flights.forEach(f => {
            // 2. Update/Create Map Markers
            const pos = [f.latitude, f.longitude];
            
            if (markers[f.callsign]) {
                markers[f.callsign].setLatLng(pos);
            } else {
                const marker = L.circleMarker(pos, {
                    radius: 7,
                    fillColor: "#c8920a", // vUPS Gold
                    color: "#fff",
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.9
                }).addTo(map);
                
                marker.bindPopup(`<b>${f.callsign}</b><br>${f.pilot_name}<br>${f.aircraft}`);
                markers[f.callsign] = marker;
            }

            // 3. Build Table Row
            tableHtml += `
                <tr>
                    <td><span class="b-gold">${f.callsign}</span></td>
                    <td>${f.aircraft || 'B748'}</td>
                    <td>${f.pilot_name}</td>
                    <td>${Math.round(f.altitude)} FT</td>
                    <td>${Math.round(f.groundspeed)} KTS</td>
                    <td>
                        <div class="flight-prog-bar">
                            <div class="flight-prog-fill" style="width:65%"></div>
                        </div>
                    </td>
                </tr>
            `;
        });

        tableBody.innerHTML = tableHtml;
        document.getElementById('connection-status').innerText = `POLLING: ACTIVE (${flights.length} FLIGHTS)`;
    }

    // Run every 15 seconds
    setInterval(fetchLiveFlights, 15000);
    fetchLiveFlights(); // Initial load
</script>

</body>
</html>
